name: Test Vue Frontend

on:
  workflow_dispatch: # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Adjust to your project's Node version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test # Or "npm run test:unit" if using Vue CLI or Vitest

      # Optionally upload test results or coverage report here
